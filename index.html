<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Foxel | The foxiest Discord bot</title>
    <meta
      name="description"
      content="Foxel is an open-source Discord bot with AI features, weather, crypto prices, useful server tools, and a little fun."
    />
    <meta name="author" content="JemeDev" />
    <meta name="keywords" content="Foxel, Discord bot, open source, weather bot, crypto bot" />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="color-scheme" content="dark" />

    <link rel="canonical" href="https://foxel.jeme.app/" />
    <link rel="icon" href="assets/icon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Foxel" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://foxel.jeme.app/" />
    <meta property="og:title" content="Foxel | The foxiest Discord bot" />
    <meta
      property="og:description"
      content="AI features, weather, crypto prices, useful server tools, and a little fun, all in one open-source Discord bot."
    />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Foxel | The foxiest Discord bot" />
    <meta
      name="twitter:description"
      content="A playful, open-source Discord bot with AI features, weather, crypto prices, server tools, and more."
    />

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="ambient ambient--left" aria-hidden="true"></div>
    <div class="ambient ambient--right" aria-hidden="true"></div>

    <main class="shell">
      <section class="hero" aria-labelledby="hero-title">
        <div class="icon-wrap" aria-hidden="true">
          <span class="icon-wrap__glow"></span>
          <img src="assets/icon.ico" alt="" width="112" height="112" />
          <span class="status-dot"></span>
        </div>

        <div class="eyebrow">Foxel Discord bot</div>

        <h1 id="hero-title">A smarter sidekick<br />for your <em>server.</em></h1>

        <p class="intro">
          AI, weather, crypto, and handy tools—with a little fox mischief.
        </p>

        <div class="actions">
          <a
            class="button button--primary"
            href="https://discord.com/api/oauth2/authorize?client_id=855042237687791646&amp;permissions=2048&amp;scope=bot"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19.5 5.3A18 18 0 0 0 15 3.9l-.6 1.2a16 16 0 0 0-4.8 0L9 3.9a18 18 0 0 0-4.5 1.4C1.7 9.5 1 13.5 1.4 17.4a18 18 0 0 0 5.6 2.8l1.3-1.8-1.8-.9.4-.3a13 13 0 0 0 10.2 0l.4.3-1.8.9 1.3 1.8a18 18 0 0 0 5.6-2.8c.5-4.5-.8-8.5-3.1-12.1ZM8.5 15.1c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Zm7 0c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Z" />
            </svg>
            Invite to Discord
            <span aria-hidden="true">↗</span>
          </a>

          <a
            class="button button--secondary"
            href="https://github.com/thejeme/foxel"
            target="_blank"
            rel="noopener noreferrer"
          >
            Explore the code
          </a>
        </div>
      </section>

    </main>
  </body>
</html>
